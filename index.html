<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penny</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Penny">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E3EEF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#BF9000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
  /* Palette borrowed from the Maltese luzzu: harbour blue, sun yellow, hull red, sea green */
  :root{
    --bg:#E3EEF4; --surface:#FFFFFF; --ink:#13212E; --muted:#5B6B79; --line:#D0DAE0;
    --accent:#1F5FA8; --sun:#F2B705; --danger:#C8352E; --good:#2E8B57;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0E1C2A; --surface:#162737; --ink:#E4EBF0; --muted:#8C9EAD; --line:#26394B;
      --accent:#BF9000; --danger:#E86A62; --good:#4DB37C;
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{
    font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));
  }
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .top{max-width:560px;margin:0 auto;padding:14px 18px 0;display:flex;align-items:center;justify-content:space-between}
  .brand{font-weight:800;font-size:24px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .brand img{width:34px;height:34px;border-radius:9px}
  .keybox{font-family:inherit;letter-spacing:.08em;text-transform:uppercase}
  .foot{text-align:center;color:var(--muted);font-size:13px;margin-top:28px}
  .who{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
  main{max-width:560px;margin:0 auto;padding:12px 18px 24px}
  h2{font-size:20px;font-weight:700;margin:28px 0 10px;letter-spacing:-.01em}
  h2.first{margin-top:8px}
  .muted{color:var(--muted)}
  .note{color:var(--muted);margin:0 0 10px;font-size:15px}

  .seg{display:flex;gap:3px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
  .seg button{flex:1;border:0;background:none;padding:9px 0;border-radius:9px;color:var(--muted)}
  .seg button.on{background:var(--ink);color:var(--bg);font-weight:600}

  .pnav{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
  .pnav b{font-weight:600}
  .arrow{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1}
  .arrow:disabled{opacity:.3}

  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chips.center{justify-content:center;margin:4px 0 10px}
  .chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:15px;display:inline-flex;align-items:center;gap:7px}
  .chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}

  .total{font-size:clamp(46px,15vw,66px);font-weight:800;letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:8px}
  .stripe{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--line);margin:16px 0 4px}
  .stripe span{display:block;height:100%}

  .flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
  .flow div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
  .flow small{display:block;color:var(--muted);font-size:13px}
  .flow strong{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}

  .rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .rows li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
  .rows li:first-child{border-top:0}
  .rows li.tap{cursor:pointer}
  .dot{width:11px;height:11px;border-radius:3px;flex:none;display:inline-block}
  .grow{flex:1;min-width:0}
  .grow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grow .s{font-size:13px;color:var(--muted)}
  .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .day{font-size:14px;color:var(--muted);margin:18px 2px 6px;display:flex;justify-content:space-between}
  .empty{padding:26px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}

  label.f{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
  input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px;min-width:0}
  input.big{font-size:34px;font-weight:700;padding:10px 14px;font-variant-numeric:tabular-nums}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .inline{display:flex;gap:8px;align-items:center}
  .inline .btn{margin:0;width:auto;padding:12px 18px}

  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:700;background:var(--accent);color:#fff;margin-top:18px;text-align:center;text-decoration:none}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:600}
  .btn.danger{background:none;color:var(--danger);border:1px solid var(--line);font-weight:600;margin-top:10px}
  .btn:disabled{opacity:.6}
  .x{border:0;background:none;color:var(--muted);font-size:22px;min-width:36px;height:36px;border-radius:18px;flex:none}
  .x.armed{font-size:14px;color:var(--danger);font-weight:700;padding:0 10px}
  select.mini{width:auto;max-width:52%;padding:8px 10px;font-size:15px}

  .goal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .goal .line{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .progress{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:10px 0 6px}
  .progress span{display:block;height:100%;background:var(--good)}
  .goal .acts{display:flex;gap:8px;margin-top:12px;align-items:center}
  .goal .acts .btn{margin:0;padding:10px}

  .swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .sw{width:34px;height:34px;border-radius:8px;border:3px solid transparent}
  .sw.on{border-color:var(--ink)}

  .bar{position:fixed;left:0;right:0;bottom:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;z-index:5}
  .bar button{border:0;background:none;padding:10px 4px;font-size:13px;color:var(--muted);min-width:64px}
  .bar button.on{color:var(--ink);font-weight:700}
  .bar .add{width:58px;height:58px;min-width:58px;border-radius:50%;background:var(--sun);color:#13212E;font-size:32px;font-weight:600;line-height:1;margin-top:-28px;box-shadow:0 0 0 5px var(--bg)}

  .scrim{position:fixed;inset:0;background:rgba(5,12,20,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;z-index:10}
  .sheet.on{transform:none}
  .sheet .head{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
  .sheet h3{margin:0;font-size:20px}

  .toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:90vw}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:var(--danger);color:#fff}
  .err-text{color:var(--danger);font-size:14px;margin-top:8px;min-height:1.2em}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  .warn{display:flex;gap:10px;align-items:flex-start;background:#FFF4D6;border:1px solid #F2B705;color:#5A4300;border-radius:12px;padding:10px 12px;margin:14px 0 0;font-size:15px}
  .warn.over{background:#FBE3E1;border-color:#C8352E;color:#7A1F19}
  @media (prefers-color-scheme:dark){.warn{background:#3A3010;border-color:#8A6D00;color:#F5DFA0}.warn.over{background:#3E1715;border-color:#E86A62;color:#F6C2BE}}
  .mbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
  .mbar span{display:block;height:100%}
  .tag{font-size:12px;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px;font-weight:500}
  .est .big{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0 10px}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
  .kv:first-of-type{border-top:0}
  .kv b{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .good{color:var(--good)}
  .bad{color:var(--danger)}
  .sync{max-width:524px;margin:10px auto 0;padding:8px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .sync[hidden]{display:none}
  .sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sun);flex:none}
  .sync.busy::before{background:var(--accent)}
  @media (max-width:560px){.sync{margin:10px 18px 0}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><img src="icon-192.png" alt="">Penny</div>
  <button class="who" id="whoBtn" data-act="who"></button>
</header>
<div class="sync" id="sync" role="status" hidden></div>

<main id="view"><p class="muted">Loading…</p></main>

<nav class="bar">
  <button data-act="tab" data-tab="overview" class="on">Spending</button>
  <button data-act="tab" data-tab="income">Income</button>
  <button class="add" data-act="add" aria-label="Add expense">+</button>
  <button data-act="tab" data-tab="goals">Savings</button>
  <button data-act="tab" data-tab="settings">Settings</button>
</nav>

<div class="scrim" id="scrim" data-act="close"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script>
/* Settings live in config.js, so updating this file never wipes your backend URL */
const CFG = window.PENNY_CONFIG || {};
const API_URL = CFG.apiUrl || '';
const SAVINGS_START = /^\d{4}-\d{2}$/.test(CFG.savingsStart || '') ? CFG.savingsStart : '2027-01';
const VERSION = '1.2.0';
const ALERT_AT = 0.7; // personal-limit alert threshold

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = new Intl.NumberFormat('en-IE', { style: 'currency', currency: 'EUR' });
const money = n => fmt.format(n || 0);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const today = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };
const sum = list => list.reduce((t, x) => t + x.amount, 0);
const clone = o => JSON.parse(JSON.stringify(o));
const eq = (a, b) => String(a).toLowerCase() === String(b).toLowerCase();
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const PALETTE = ['#1F5FA8','#2E8B57','#E0A500','#C8352E','#7B4FB0','#159A9C','#D9622B','#7A8794'];
const dayLabel = d => DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()];
const parseAmt = v => Math.round(Number(String(v).replace(/[^\d.,]/g, '').replace(',', '.')) * 100) / 100;
const normKey = k => String(k || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const showKey = k => (normKey(k).match(/.{1,4}/g) || []).join('-');
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const APP_LINK = location.origin + location.pathname;
const cap = w => w[0].toUpperCase() + w.slice(1);
const ym = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const monthName = m => { const p = m.split('-').map(Number); return MONTHS[p[1] - 1] + ' ' + p[0]; };
const prevYm = m => { const p = m.split('-').map(Number); return ym(new Date(p[0], p[1] - 2, 1)); };
const inMonth = (x, m) => x.date.slice(0, 7) === m;
const fullDate = s => { const d = parse(s); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
const catType = c => (c && ['fixed', 'personal'].includes(c.type)) ? c.type : 'shared';
function limitsOf(c) {
  if (!c) return {};
  if (c.limits && typeof c.limits === 'object') return c.limits;
  try { return JSON.parse(c.limits || '{}') || {}; } catch (e) { return {}; }
}
// Monthly target for a category. Personal categories: one person's limit, or everyone's added up.
function catTarget(c, person) {
  if (!c) return 0;
  if (catType(c) === 'personal') {
    const l = limitsOf(c);
    return person ? (Number(l[person]) || 0) : S.data.people.reduce((t, p) => t + (Number(l[p]) || 0), 0);
  }
  return Number(c.target) || 0;
}
const getCat = name => S.data.categories.find(c => c.name === name);

// Random id made on the phone, so an entry has its final id even before it reaches the Sheet
function uid() {
  const a = new Uint8Array(12);
  crypto.getRandomValues(a);
  return Array.from(a, b => '0123456789abcdefghijklmnopqrstuvwxyz'[b % 36]).join('');
}

// Phone storage (this device only). Falls back to keys saved before the rename.
const store = {
  get: k => { try { return localStorage.getItem('penny.' + k) ?? localStorage.getItem('kitty.' + k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem('penny.' + k, v); } catch (e) {} },
  del: k => { try { localStorage.removeItem('penny.' + k); localStorage.removeItem('kitty.' + k); } catch (e) {} }
};
function loadJSON(k, fallback) { try { return JSON.parse(store.get(k) || 'null') || fallback; } catch (e) { return fallback; } }

const S = {
  server: loadJSON('data', null),   // last copy received from the Sheet
  outbox: loadJSON('outbox', []),   // changes saved on this phone, not yet in the Sheet
  data: null,                       // what's shown: server copy + outbox replayed on top
  tab: 'overview', view: 'month', offset: 0, filter: 'all',
  key: store.get('key') || '', who: store.get('who') || '',
  draft: null, adj: null, catDraft: null, goalDraft: null, renaming: null, goalsFor: '', locked: false,
  flushing: false, reqSeq: 0, appliedSeq: 0
};

/* ---------- Talking to the backend ---------- */
async function call(action, ...args) {
  if (!/^https:\/\/script\.google\.com\//.test(API_URL)) {
    throw new Error('The app isn’t connected to a backend yet. Paste the Apps Script URL into apiUrl in config.js.');
  }
  let res, out;
  try {
    // text/plain keeps this a "simple" request, so the browser skips the CORS preflight Apps Script can't answer
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: S.key, action, args }),
      redirect: 'follow'
    });
  } catch (e) {
    const err = new Error('Can’t reach the server. Check your internet connection.');
    err.code = 'OFFLINE';
    throw err;
  }
  try { out = await res.json(); }
  catch (e) {
    const err = new Error('The server sent an unexpected reply. Check the Apps Script deployment is set to “Anyone”.');
    err.code = 'OFFLINE'; // treat like a connection problem: keep changes queued
    throw err;
  }
  if (!out.ok) {
    const err = new Error(out.error || 'Something went wrong.');
    err.code = out.code;
    if (out.code === 'BAD_KEY') { S.key = ''; store.del('key'); setTimeout(() => openSetup(out.error), 0); }
    throw err;
  }
  return out.data;
}
function errMsg(e) { return (e && e.message ? e.message : String(e)).replace(/^(Exception|Error):\s*/, ''); }

/* ---------- Offline outbox ----------
   Every change is applied to the screen immediately and added to the outbox.
   flush() sends the outbox to the Sheet in one batch. Anything that doesn't get
   through stays queued and is retried when the connection returns. */

// Mirrors of the server's write functions, used to show queued changes straight away
const LOCAL = {
  saveExpense:    (d, x) => upsertBy(d.expenses, 'id', x),
  deleteExpense:  (d, id) => removeBy(d.expenses, 'id', id),
  saveIncome:     (d, x) => upsertBy(d.income, 'id', x),
  deleteIncome:   (d, id) => removeBy(d.income, 'id', id),
  saveGoal:       (d, g) => upsertBy(d.goals, 'id', g),
  adjustGoal:     (d, id, delta) => { const g = d.goals.find(g => eq(g.id, id)); if (g) g.saved = Math.max(0, Math.round((g.saved + delta) * 100) / 100); },
  deleteGoal:     (d, id) => removeBy(d.goals, 'id', id),
  saveCategory:   (d, c, legacyColor) => {
    if (typeof c !== 'object' || c === null) c = { name: c, color: legacyColor };
    upsertBy(d.categories, 'name', { name: c.name, color: c.color, target: Number(c.target) || 0, type: c.type || 'shared', limits: JSON.stringify(c.limits || {}) });
  },
  deleteCategory: (d, name) => removeBy(d.categories, 'name', name),
  savePreset:     (d, name, category) => upsertBy(d.presets, 'name', { name, category }),
  deletePreset:   (d, name) => removeBy(d.presets, 'name', name),
  addPerson:      (d, name) => { if (!d.people.some(p => eq(p, name))) d.people.push(name); },
  deletePerson:   (d, name) => { d.people = d.people.filter(p => !eq(p, name)); },
  renamePerson:   (d, from, to) => {
    d.people = d.people.map(p => eq(p, from) ? to : p);
    d.expenses.forEach(x => { if (eq(x.who, from)) x.who = to; });
    d.income.forEach(x => { if (eq(x.who, from)) x.who = to; });
    d.goals.forEach(g => { if (eq(g.owner, from)) g.owner = to; });
    d.categories.forEach(c => {
      const l = limitsOf(c), k = Object.keys(l).find(k => eq(k, from));
      if (k) { l[to] = l[k]; delete l[k]; c.limits = JSON.stringify(l); }
    });
  }
};
function upsertBy(list, key, obj) {
  const i = list.findIndex(o => eq(o[key], obj[key]));
  if (i > -1) list[i] = Object.assign({}, list[i], obj); else list.push(obj);
}
function removeBy(list, key, val) {
  const i = list.findIndex(o => eq(o[key], val));
  if (i > -1) list.splice(i, 1);
}

function saveOutbox() { store.set('outbox', JSON.stringify(S.outbox)); }

function queue(action, args, okMsg) {
  S.outbox.push({ id: uid(), action, args, at: Date.now() });
  saveOutbox();
  recompute();
  if (okMsg) toast(okMsg);
  flush();
}

// Rebuild what's on screen: the Sheet's copy with every pending change replayed on top
function recompute() {
  if (!S.server) return;
  const d = clone(S.server);
  S.outbox.forEach(op => { try { LOCAL[op.action](d, ...op.args); } catch (e) {} });
  showData(d);
}

function setServer(d, seq) {
  if (seq < S.appliedSeq) return; // an older reply arrived after a newer one: ignore it
  S.appliedSeq = seq;
  S.server = d;
  store.set('data', JSON.stringify(d));
  recompute();
}

let retryTimer = null;
function scheduleRetry() {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => { retryTimer = null; flush(); }, 20000);
}

async function flush() {
  if (S.flushing || !S.outbox.length || !S.key) { updateSync(); return; }
  S.flushing = true;
  updateSync();
  const batch = S.outbox.slice();
  let sent = false;
  try {
    const res = await call('batch', batch.map(o => ({ id: o.id, action: o.action, args: o.args })));
    const handled = new Set(res.results.map(r => r.id));
    const failed = res.results.filter(r => !r.ok);
    S.outbox = S.outbox.filter(o => !handled.has(o.id));
    saveOutbox();
    // This snapshot was read after our changes were written, so it outranks any reply still in flight
    setServer(res.snapshot, ++S.reqSeq);
    sent = true;
    if (failed.length) toast(plural(failed.length, 'change') + ' couldn’t be saved: ' + failed[0].error, true);
  } catch (e) {
    if (e.code !== 'BAD_KEY') scheduleRetry();
  } finally {
    S.flushing = false;
    updateSync();
    // Changes made while this batch was in flight go out straight after
    if (sent && S.outbox.length) flush();
  }
}

async function refresh() {
  if (!S.key) return;
  const seq = ++S.reqSeq;
  try { setServer(await call('getData'), seq); }
  catch (e) { /* offline: keep showing the saved copy */ }
  if (!S.server) $('#view').innerHTML = '<div class="empty">Penny needs a connection the first time it loads your data. Connect to the internet and reopen the app.</div>';
}

function updateSync() {
  const el = $('#sync');
  const n = S.outbox.length;
  el.hidden = !n;
  el.classList.toggle('busy', S.flushing);
  if (n) el.textContent = S.flushing
    ? 'Syncing ' + plural(n, 'change') + '…'
    : plural(n, 'change') + ' saved on this phone, waiting for a connection';
}

/* ---------- UI helpers ---------- */
let toastTimer;
function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), isErr ? 4500 : 2000);
}
function busy(btn, label) {
  if (!btn) return;
  btn.disabled = true;
  btn.dataset.label = btn.textContent;
  btn.textContent = label || 'Saving…';
}
function unbusy(btn) {
  if (!btn || !btn.isConnected) return;
  btn.disabled = false;
  if (btn.dataset.label) btn.textContent = btn.dataset.label;
}
// Two-tap delete: first tap arms the button, second tap within 3s confirms
function armed(el, txt) {
  if (el.dataset.armed) return true;
  el.dataset.armed = '1';
  el.dataset.old = el.innerHTML;
  el.innerHTML = txt || 'Delete?';
  el.classList.add('armed');
  setTimeout(() => {
    if (el.isConnected && el.dataset.armed) {
      delete el.dataset.armed;
      el.innerHTML = el.dataset.old;
      el.classList.remove('armed');
    }
  }, 3000);
  return false;
}

/* ---------- Period maths ---------- */
function range() {
  const t = today(), o = S.offset;
  if (S.view === 'day') {
    const s = new Date(t); s.setDate(s.getDate() + o);
    return { s, e: s, label: o === 0 ? 'Today' : o === -1 ? 'Yesterday' : dayLabel(s) };
  }
  if (S.view === 'week') {
    const s = new Date(t); s.setDate(s.getDate() - ((s.getDay() + 6) % 7) + 7 * o); // weeks start Monday
    const e = new Date(s); e.setDate(e.getDate() + 6);
    return { s, e, label: o === 0 ? 'This week' : s.getDate() + ' ' + MON[s.getMonth()] + ' – ' + e.getDate() + ' ' + MON[e.getMonth()] };
  }
  const s = new Date(t.getFullYear(), t.getMonth() + o, 1);
  const e = new Date(s.getFullYear(), s.getMonth() + 1, 0);
  return { s, e, label: MONTHS[s.getMonth()] + ' ' + s.getFullYear() };
}
function relDay(d) {
  const t = iso(today()), y = new Date(today()); y.setDate(y.getDate() - 1);
  if (d === t) return 'Today';
  if (d === iso(y)) return 'Yesterday';
  return dayLabel(parse(d));
}

/* ---------- Budgets ---------- */
// One person's personal categories that have a limit, with spending for month m
function personalStatus(person, m) {
  return S.data.categories.filter(c => catType(c) === 'personal').map(c => {
    const limit = catTarget(c, person);
    const spent = sum(S.data.expenses.filter(x => x.category === c.name && x.who === person && inMonth(x, m)));
    return { c, limit, spent, pct: limit ? spent / limit : 0 };
  }).filter(s => s.limit > 0);
}
function budgetLine(s, person, m) {
  const subj = person === S.who ? 'You’ve' : esc(person) + ' has';
  const over = s.spent - s.limit;
  return subj + ' spent <b>' + money(s.spent) + '</b> of the ' + money(s.limit) + ' ' + esc(s.c.name) + ' limit for ' + monthName(m) +
    (over >= 0 ? ', ' + money(over) + ' over.' : '. ' + money(-over) + ' left.');
}

/* ---------- Savings estimate ----------
   Per person, for the current month:
   salary − half of shared and fixed costs − own personal spending.
   Shared and personal spending come from last month; if last month is before
   SAVINGS_START (e.g. December), the category targets are used instead. */
function estimate(person) {
  const D = S.data, m = ym(today());
  if (m < SAVINGS_START) return { early: true };
  const n = D.people.length || 1, prev = prevYm(m), hist = prev >= SAVINGS_START;

  let income = sum(D.income.filter(x => x.who === person && inMonth(x, m)));
  let incomeNote = 'received in ' + MONTHS[today().getMonth()];
  if (!income) {
    const mine = D.income.filter(x => x.who === person).sort((a, b) => b.date.localeCompare(a.date));
    if (!mine.length) return { noIncome: true };
    const lm = mine[0].date.slice(0, 7);
    income = sum(mine.filter(x => inMonth(x, lm)));
    incomeNote = 'expected, same as ' + monthName(lm);
  }

  let fixed = 0, everyday = 0, personal = 0;
  const missing = [];
  D.categories.forEach(c => {
    const t = catType(c);
    const prevAll = sum(D.expenses.filter(x => x.category === c.name && inMonth(x, prev)));
    if (t === 'fixed') {
      const e = Number(c.target) || (hist ? prevAll : 0);
      if (!e) missing.push(c.name);
      fixed += e / n;
    } else if (t === 'personal') {
      const e = hist ? sum(D.expenses.filter(x => x.category === c.name && x.who === person && inMonth(x, prev))) : catTarget(c, person);
      if (!hist && !e) missing.push(c.name);
      personal += e;
    } else {
      const e = hist ? prevAll : (Number(c.target) || 0);
      if (!hist && !e) missing.push(c.name);
      everyday += e / n;
    }
  });
  if (hist) { // spending under categories that have since been deleted counts as shared
    const known = new Set(D.categories.map(c => c.name));
    everyday += sum(D.expenses.filter(x => !known.has(x.category) && inMonth(x, prev))) / n;
  }
  return { income, incomeNote, fixed, everyday, personal, save: income - fixed - everyday - personal, hist, prev, missing };
}
// How many monthly contributions are left before a goal's deadline (this month included)
function monthsLeft(deadline) {
  const t = today(), d = parse(deadline);
  if (d < t) return 0;
  return (d.getFullYear() - t.getFullYear()) * 12 + (d.getMonth() - t.getMonth()) + 1;
}
function goalNeed(g) {
  const rest = g.target - g.saved;
  if (rest <= 0 || !g.deadline) return null;
  const m = monthsLeft(g.deadline);
  return m ? rest / m : Infinity;
}

}

      h += '<div class="warn ' + (s.pct >= 1 ? 'over' : '') + '"><div>' + budgetLine(s, S.who, nowM) + '</div></div>';

  h += '<div class="total">' + money(total) + '</div>' +
       '<div class="muted">spent, ' + plural(ex.length, 'expense') + '</div>';

  if (total > 0) {
    h += '<div class="stripe">' + catList.map(([c, v]) =>
      '<span style="width:' + (v / total * 100) + '%;background:' + esc(catColor(c)) + '"></span>').join('') + '</div>';
  }

  if (S.view === 'month') {
    const inc = sum(D.income.filter(x => x.date >= a && x.date <= b && mine(x)));
    const left = inc - total;
    h += '<div class="flow">' +
      '<div><small>Money in</small><strong>' + money(inc) + '</strong></div>' +
      '<div><small>Spent</small><strong>' + money(total) + '</strong></div>' +

      const pct = tgt ? v / tgt : 0;
      const sub = tgt
        ? money(v) + ' of ' + money(tgt) + (pct >= 1 ? ', ' + money(v - tgt) + ' over' : ', ' + money(tgt - v) + ' left')
        : Math.round(v / total * 100) + '% of spending';
      return '<li><i class="dot" style="background:' + esc(catColor(c)) + '"></i>' +
        '<div class="grow"><div class="t">' + esc(c) + (t !== 'shared' ? '<span class="tag">' + cap(t) + '</span>' : '') + '</div>' +
        '<div class="s' + (pct >= 1 ? ' bad' : '') + '">' + sub + '</div>' +
        (tgt ? '<div class="mbar"><span style="width:' + Math.min(100, pct * 100) + '%;background:' + (pct >= 1 ? 'var(--danger)' : esc(catColor(c))) + '"></span></div>' : '') +
        '</div><span class="amt">' + money(v) + '</span></li>';
    }).join('') + '</ul>';
  }

  h += '<h2>Expenses</h2>';

    h += '<div class="empty">Nothing logged for this period. Tap + to add an expense.</div>';
  } else {
    const pending = new Set(S.outbox.filter(o => o.action === 'saveExpense').map(o => o.args[0].id));
    const byDay = {};

    Object.keys(byDay).sort().reverse().forEach(d => {
      const list = byDay[d].sort((p, q) => Number(q.created) - Number(p.created));
      h += '<div class="day"><span>' + esc(relDay(d)) + '</span><span>' + money(sum(list)) + '</span></div><ul class="rows">' +

          '<span class="amt">' + money(x.amount) + '</span></li>').join('') + '</ul>';

function viewGoals() {
  const D = S.data;
  const viewer = D.people.includes(S.goalsFor) ? S.goalsFor : (S.who || D.people[0]);
  const own = viewer === S.who;
  const yours = own ? 'Your' : esc(viewer) + '’s';
  let h = '';

  if (D.people.length > 1) {
    h += '<div class="chips center" style="margin-top:4px">' + D.people.map(p =>
      '<button class="chip ' + (p === viewer ? 'on' : '') + '" data-act="goalsFor" data-p="' + esc(p) + '">' + esc(p) + '</button>').join('') + '</div>';
  }

  // Monthly estimate
  const e = estimate(viewer);
  h += '<h2 class="first">' + yours + ' monthly savings</h2><div class="goal est">';
  if (e.early) {
    h += '<p class="note" style="margin:0">The estimate starts in ' + monthName(SAVINGS_START) + '. December is left out because it’s an unusual spending month.</p>';
  } else if (e.noIncome) {
    h += '<p class="note" style="margin:0">Add ' + (own ? 'your' : esc(viewer) + '’s') + ' salary in the Income tab to see how much can go to savings.</p>';
  } else {
    h += '<small class="muted">Can put aside in ' + MONTHS[today().getMonth()] + '</small>' +
      '<div class="big ' + (e.save < 0 ? 'bad' : '') + '">' + money(Math.max(0, e.save)) + '</div>' +
      '<div class="kv"><span>Salary <span class="muted">(' + esc(e.incomeNote) + ')</span></span><b>' + money(e.income) + '</b></div>' +
      '<div class="kv"><span>Fixed costs <span class="muted">(your half)</span></span><b>−' + money(e.fixed) + '</b></div>' +
      '<div class="kv"><span>Everyday spending <span class="muted">(your half)</span></span><b>−' + money(e.everyday) + '</b></div>' +
      '<div class="kv"><span>Personal spending</span><b>−' + money(e.personal) + '</b></div>';
    if (e.save < 0) h += '<div class="warn over"><div>Expected costs are ' + money(-e.save) + ' more than the salary this month.</div></div>';
    h += '<p class="note" style="margin:10px 0 0">' + (e.hist
      ? 'Based on ' + monthName(e.prev) + '’s spending. Shared costs split 50/50.'
      : 'First month counted, so spending is based on your category targets. Shared costs split 50/50.') + '</p>';
    if (e.missing.length) h += '<p class="note" style="margin:6px 0 0">No target set for ' + e.missing.map(esc).join(', ') + '. Add targets in Settings for a better estimate.</p>';
  }
  h += '</div>';

  // Goals
  const G = D.goals.filter(g => g.owner ? g.owner === viewer : true);
  const needs = G.map(goalNeed).filter(v => v !== null);
  if (!e.early && !e.noIncome && needs.length) {
    const total = needs.reduce((t, v) => t + v, 0);
    if (isFinite(total)) {
      const ok = total <= Math.max(0, e.save);
      h += '<div class="warn ' + (ok ? '' : 'over') + '" style="' + (ok ? 'background:transparent;border-color:var(--line);color:inherit' : '') + '"><div>' +
        (own ? 'Your' : esc(viewer) + '’s') + ' goals need <b>' + money(total) + '</b> a month. ' +
        (ok ? 'That fits within this month’s estimate.' : 'That’s ' + money(total - Math.max(0, e.save)) + ' more than this month’s estimate.') + '</div></div>';
    }
  }

  h += '<h2>' + yours + ' goals</h2>';
  if (!G.length) h += '<div class="empty">' + (own ? 'No goals yet. Add one below, like an emergency fund or a holiday.' : esc(viewer) + ' has no savings goals yet.') + '</div>';
  G.forEach(g => {
    const pct = g.target ? Math.min(100, g.saved / g.target * 100) : 0;
    const rest = g.target - g.saved;
    const need = goalNeed(g);
    let plan = '';
    if (rest <= 0) plan = 'Goal reached';
    else if (g.deadline && need === Infinity) plan = '<span class="bad">Deadline ' + fullDate(g.deadline) + ' has passed</span>';
    else if (g.deadline) plan = money(need) + ' a month to reach it by ' + fullDate(g.deadline);
    h += '<div class="goal">' +
      '<div class="line"><strong>' + esc(g.name) + '</strong><span class="muted">' + Math.floor(pct) + '%</span></div>' +
      '<div class="progress"><span style="width:' + pct + '%"></span></div>' +
      '<div class="line"><span class="amt">' + money(g.saved) + '</span><span class="muted">of ' + money(g.target) +
      (rest > 0 ? ', ' + money(rest) + ' to go' : '') + '</span></div>' +
      (plan ? '<div class="note" style="margin:6px 0 0">' + plan + '</div>' : '') +
      (own || !g.owner ? '<div class="acts">' +
        '<button class="btn" data-act="goalAdj" data-id="' + esc(g.id) + '" data-dir="1">Add money</button>' +
        '<button class="btn ghost" data-act="goalAdj" data-id="' + esc(g.id) + '" data-dir="-1">Take out</button>' +
        '<button class="btn ghost" style="flex:0 0 auto;width:auto;padding:10px 14px" data-act="editGoal" data-id="' + esc(g.id) + '">Edit</button>' +
        '</div>' : '') +
      '</div>';
  });

  if (own) {
    h += '<h2>New goal</h2>' +
      '<label class="f" for="gName">Name</label><input id="gName" placeholder="e.g. Emergency fund">' +
      '<div class="row2"><div><label class="f" for="gTarget">Goal amount</label><input id="gTarget" inputmode="decimal" placeholder="€0.00"></div>' +
      '<div><label class="f" for="gDeadline">Reach it by</label><input id="gDeadline" type="date"></div></div>' +
      '<label class="f" for="gSaved">Already saved</label><input id="gSaved" inputmode="decimal" placeholder="€0.00">' +
      '<div class="err-text" id="gErr"></div>' +
      '<button class="btn" data-act="addGoal">Create goal</button>';
  } else if (!S.who) {
    h += '<p class="note" style="margin-top:14px">Pick who’s using this phone to add goals.</p>';
  }
  return h;
}

  h += '<h2>Quick picks</h2><p class="note">Names you can tap when adding an expense. Each one fills in its category for you.</p>' +
    (D.presets.length ? '<ul class="rows">' + D.presets.map(p =>
      '<li><div class="grow"><div class="t">' + esc(p.name) + '</div></div>' +
      '<select class="mini" data-chg="presetCat" data-n="' + esc(p.name) + '" aria-label="Category for ' + esc(p.name) + '">' + catOptions(p.category) + '</select>' +
      '<button class="x" data-act="delPreset" data-n="' + esc(p.name) + '" aria-label="Delete ' + esc(p.name) + '">×</button></li>').join('') + '</ul>' : '') +
    '<div class="row2"><div><label class="f" for="pName">Name</label><input id="pName" placeholder="e.g. Pharmacy"></div>' +
    '<div><label class="f" for="pCat">Category</label><select id="pCat">' + catOptions('') + '</select></div></div>' +
    '<div class="err-text" id="pErr"></div>' +
    '<button class="btn" data-act="addPreset">Add quick pick</button>';

  h += '<h2>People</h2><ul class="rows">' + D.people.map(p =>
    '<li><div class="grow">' + esc(p) + '</div>' +
    '<button class="btn ghost" style="width:auto;margin:0;padding:6px 12px" data-act="rename" data-n="' + esc(p) + '">Rename</button>' +
    (D.people.length > 1 ? '<button class="x" data-act="delPerson" data-n="' + esc(p) + '" aria-label="Remove ' + esc(p) + '">×</button>' : '') +
    '</li>').join('') + '</ul>' +
    '<div class="inline" style="margin-top:10px"><input id="pplName" placeholder="Add a name"><button class="btn" data-act="addPerson">Add</button></div>';

  h += '<h2>This phone</h2><ul class="rows">' +
    '<li><div class="grow"><div class="t">Logging as ' + esc(S.who || 'nobody yet') + '</div></div>' +
    '<button class="btn ghost" style="width:auto;margin:0;padding:8px 14px" data-act="who">Switch</button></li>' +
    '<li><div class="grow"><div class="t">' + (S.outbox.length ? plural(S.outbox.length, 'change') + ' waiting to sync' : 'Everything is synced') + '</div></div>' +
    '<button class="btn ghost" style="width:auto;margin:0;padding:8px 14px" data-act="syncNow">Sync now</button></li></ul>' +
    '<button class="btn danger" data-act="disconnect">Disconnect this phone</button>';

  h += '<h2>Set up another phone</h2><p class="note">Send them the app link and the access key. ' +
    'On iPhone: open the link in Safari, tap Share, then Add to Home Screen. Open Penny from the home screen and paste the key there.</p>' +
    '<label class="f">App link</label><input readonly value="' + esc(APP_LINK) + '" onclick="this.select()">' +
    '<label class="f">Access key</label><div class="inline"><input class="keybox" readonly value="' + esc(showKey(S.key)) + '" onclick="this.select()">' +
    '<button class="btn" data-act="copyKey">Copy</button></div>';

  h += '<div class="foot">Penny v' + VERSION + '</div>';
  return h;
}

/* ---------- Sheets (pop-up panels) ---------- */
function openSheet(html, locked) {
  S.locked = !!locked;
  $('#sheet').innerHTML = html;
  $('#sheet').classList.add('on');
  $('#scrim').classList.add('on');
}
function closeSheet(force) {
  if (S.locked && force !== true) return;
  S.locked = false;
  $('#sheet').classList.remove('on');
  $('#scrim').classList.remove('on');
}
const sheetHead = (title, noClose) => '<div class="head"><h3>' + title + '</h3>' +
  (noClose ? '' : '<button class="x" data-act="close" aria-label="Close">×</button>') + '</div>';

function catSummary(c) {
  const t = catType(c);
  if (t === 'personal') {
    const l = limitsOf(c);
    const set = S.data.people.filter(p => Number(l[p]) > 0);
    return set.length ? set.map(p => esc(p) + ' ' + money(l[p])).join(', ') + ' a month' : 'No limits set yet';
  }
  const tgt = Number(c.target) || 0;
  if (t === 'fixed') return tgt ? 'About ' + money(tgt) + ' a month' : 'No monthly amount set yet';
  return tgt ? 'Target ' + money(tgt) + ' a month' : 'No target';
}

function openCategory(c) {
  if (c) {
    S.catDraft = { isNew: false, name: c.name, color: c.color, type: catType(c), target: Number(c.target) || 0, limits: Object.assign({}, limitsOf(c)) };
  } else {
    const used = S.data.categories.map(c => String(c.color).toUpperCase());
    const free = PALETTE.find(p => !used.includes(p.toUpperCase())) || PALETTE[0];
    S.catDraft = { isNew: true, name: '', color: free, type: 'shared', target: 0, limits: {} };
  }
  renderCatSheet();
}
function syncCatDraft() {
  const d = S.catDraft;
  if ($('#cdName')) d.name = $('#cdName').value;
  if ($('#cdTarget')) d.target = parseAmt($('#cdTarget').value) || 0;
  document.querySelectorAll('.cdLim').forEach(el => { d.limits[el.dataset.p] = parseAmt(el.value) || 0; });
}
function renderCatSheet() {
  const d = S.catDraft, P = S.data.people;
  const info = {
    shared: 'A household cost. Split 50/50 in the savings estimate.',
    fixed: 'A bill that’s about the same every month, like rent. The amount below is used as the expected cost each month.',
    personal: 'Each person gets their own monthly limit. An alert pops up at 70%.'
  };
  openSheet(
    sheetHead(d.isNew ? 'New category' : esc(d.name)) +
    (d.isNew ? '<label class="f" for="cdName">Name</label><input id="cdName" value="' + esc(d.name) + '" placeholder="e.g. Health">' : '') +
    '<label class="f">Type</label><div class="seg">' + ['shared', 'fixed', 'personal'].map(t =>
      '<button data-act="cdType" data-t="' + t + '" class="' + (d.type === t ? 'on' : '') + '">' + cap(t) + '</button>').join('') + '</div>' +
    '<p class="note" style="margin:8px 0 0">' + info[d.type] + '</p>' +
    (d.type === 'personal'
      ? P.map((p, i) => '<label class="f" for="cdLim' + i + '">Monthly limit for ' + esc(p) + '</label>' +
          '<input id="cdLim' + i + '" class="cdLim" data-p="' + esc(p) + '" inputmode="decimal" placeholder="No limit" value="' + (Number(d.limits[p]) > 0 ? Number(d.limits[p]).toFixed(2) : '') + '">').join('')
      : '<label class="f" for="cdTarget">' + (d.type === 'fixed' ? 'Usual monthly amount' : 'Monthly target (max)') + '</label>' +
        '<input id="cdTarget" inputmode="decimal" placeholder="' + (d.type === 'fixed' ? '€0.00' : 'No target') + '" value="' + (d.target ? d.target.toFixed(2) : '') + '">') +
    '<label class="f">Colour</label><div class="swatches">' + PALETTE.map(p =>
      '<button class="sw ' + (p.toUpperCase() === String(d.color).toUpperCase() ? 'on' : '') + '" style="background:' + p + '" data-act="cdColor" data-c="' + p + '" aria-label="Colour ' + p + '"></button>').join('') + '</div>' +
    '<div class="err-text" id="cdErr"></div>' +
    '<button class="btn" data-act="saveCat">' + (d.isNew ? 'Add category' : 'Save changes') + '</button>' +
    (d.isNew ? '' : '<button class="btn danger" data-act="delCatSheet">Delete category</button>')
  );
}

function openBudgetAlert(s, person, m) {
  const over = s.pct >= 1;
  openSheet(
    sheetHead(over ? esc(s.c.name) + ' limit passed' : esc(s.c.name) + ' at ' + Math.floor(s.pct * 100) + '%') +
    '<div class="warn ' + (over ? 'over' : '') + '" style="margin-top:4px"><div>' + budgetLine(s, person, m) + '</div></div>' +
    '<div class="mbar" style="height:10px;margin-top:14px"><span style="width:' + Math.min(100, s.pct * 100) + '%;background:' + (over ? 'var(--danger)' : 'var(--sun)') + '"></span></div>' +
    '<button class="btn" data-act="close">Got it</button>'
  );
}

function openRename(p) {
  S.renaming = p;
  openSheet(
    sheetHead('Rename ' + esc(p)) +
    '<label class="f" for="rnName">New name</label><input id="rnName" value="' + esc(p) + '" autocomplete="off">' +
    '<p class="note" style="margin-top:8px">Their past expenses, income, goals and limits move to the new name.</p>' +
    '<div class="err-text" id="rnErr"></div>' +
    '<button class="btn" data-act="saveRename">Rename</button>'
  );
}

function openGoalEdit(g) {
  S.goalDraft = Object.assign({}, g);
  openSheet(
    sheetHead('Edit goal') +
    '<label class="f" for="geName">Name</label><input id="geName" value="' + esc(g.name) + '">' +
    '<div class="row2"><div><label class="f" for="geTarget">Goal amount</label><input id="geTarget" inputmode="decimal" value="' + g.target.toFixed(2) + '"></div>' +
    '<div><label class="f" for="geDeadline">Reach it by</label><input id="geDeadline" type="date" value="' + esc(g.deadline || '') + '"></div></div>' +
    '<p class="note" style="margin-top:8px">Saved so far: ' + money(g.saved) + '. Use Add money or Take out to change it.</p>' +
    '<div class="err-text" id="geErr"></div>' +
    '<button class="btn" data-act="saveGoalEdit">Save changes</button>' +
    '<button class="btn danger" data-act="delGoalSheet">Delete goal</button>'
  );
}

function openSetup(msg) {
  openSheet(
    sheetHead('Connect Penny', true) +
    '<p class="note">Paste the access key to link this phone to your household’s data. You only need to do this once per phone.</p>' +
    '<label class="f" for="kIn">Access key</label>' +
    '<input id="kIn" class="keybox" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX">' +
    '<div class="err-text" id="kErr">' + esc(msg || '') + '</div>' +
    '<button class="btn" data-act="connect">Connect</button>',
    true
  );
}

function openExpense(x) {
  const D = S.data;
  S.draft = x ? Object.assign({}, x) : { date: iso(today()), amount: '', name: '', category: '', who: S.who || D.people[0] };
  const d = S.draft;
  const presets = presetsByUse();
  openSheet(
    sheetHead(x ? 'Edit expense' : 'New expense') +
    '<label class="f" for="fAmt">Amount</label>' +
    '<input id="fAmt" class="big" inputmode="decimal" placeholder="€0.00" autocomplete="off" value="' + (x ? x.amount.toFixed(2) : '') + '">' +
    (presets.length ? '<label class="f">Quick pick</label><div class="chips">' + presets.map(p =>
      '<button class="chip" data-act="preset" data-n="' + esc(p.name) + '">' + esc(p.name) + '</button>').join('') + '</div>' : '') +
    '<label class="f" for="fName">What was it?</label>' +
    '<input id="fName" list="presetList" autocomplete="off" placeholder="e.g. Lidl" value="' + esc(d.name) + '">' +
    '<datalist id="presetList">' + presets.map(p => '<option value="' + esc(p.name) + '">').join('') + '</datalist>' +
    '<label class="f">Category</label><div class="chips" id="catChips">' + catChips(d.category) + '</div>' +
    '<div class="row2"><div><label class="f" for="fDate">Date</label><input id="fDate" type="date" value="' + d.date + '"></div>' +
    whoSelect('fWho', d.who) + '</div>' +
    '<div class="err-text" id="fErr"></div>' +
    '<button class="btn" data-act="saveExp">' + (x ? 'Save changes' : 'Save expense') + '</button>' +
    (x ? '<button class="btn danger" data-act="delExp">Delete expense</button>' : '')
  );
  $('#fName').addEventListener('input', e => { const p = findPreset(e.target.value); if (p) setCat(p.category); });
}
function catChips(sel) {
  return S.data.categories.map(c =>
    '<button class="chip ' + (c.name === sel ? 'on' : '') + '" data-act="cat" data-c="' + esc(c.name) + '">' +
    '<i class="dot" style="background:' + esc(c.color) + '"></i>' + esc(c.name) + '</button>').join('');
}
function setCat(c) {
  S.draft.category = c;
  $('#catChips').innerHTML = catChips(c);
}

function openGoalAdj(id, dir) {
  const g = S.data.goals.find(g => g.id === id);
  if (!g) return;
  S.adj = { id, dir };
  openSheet(
    sheetHead((dir > 0 ? 'Add to ' : 'Take from ') + esc(g.name)) +
    '<label class="f" for="aAmt">Amount</label><input id="aAmt" class="big" inputmode="decimal" placeholder="€0.00" autocomplete="off">' +
    '<div class="err-text" id="aErr"></div>' +
    '<button class="btn" data-act="saveAdj">' + (dir > 0 ? 'Add money' : 'Take out') + '</button>'
  );
}

function openWho() {
  const P = S.data.people;
  const first = !S.who;
  openSheet(
    sheetHead('Who’s using this phone?', first) +
    '<p class="note">Expenses you add from this phone will be marked with this name.</p>' +
    P.map(p => '<button class="btn ' + (p === S.who ? '' : 'ghost') + '" data-act="pickWho" data-p="' + esc(p) + '">' + esc(p) + '</button>').join(''),
    first
  );
}

/* ---------- Actions ---------- */
const ACTS = {
  tab: el => { S.tab = el.dataset.tab; closeSheet(); render(); window.scrollTo(0, 0); },
  view: el => { S.view = el.dataset.v; S.offset = 0; render(); },
  shift: el => { S.offset = Math.min(0, S.offset + Number(el.dataset.d)); render(); },
  filter: el => { S.filter = el.dataset.p; render(); },
  add: () => { if (S.data && !S.locked) openExpense(); },
  edit: el => { const x = S.data.expenses.find(x => x.id === el.dataset.id); if (x) openExpense(x); },
  close: () => closeSheet(),
  who: () => { if (S.data && !S.locked) openWho(); },
  pickWho: el => {
    S.who = el.dataset.p;
    store.set('who', S.who);
    closeSheet(true);
    render();
    toast('Logging as ' + S.who);
  },

  connect: async btn => {
    const k = normKey($('#kIn').value);
    if (k.length < 8) return $('#kErr').textContent = 'Paste the full access key.';
    S.key = k;
    busy(btn, 'Connecting…');
    try {
      const seq = ++S.reqSeq;
      const d = await call('getData');
      store.set('key', k);
      closeSheet(true);
      setServer(d, seq);
      toast('Connected');
      flush();
    } catch (e) {
      S.key = '';
      unbusy(btn);
      if (!$('#kIn')) openSetup();
      $('#kErr').textContent = e.code === 'OFFLINE' ? 'Connecting needs internet. Try again once you’re online.' : errMsg(e);
    }
  },
  disconnect: el => {
    if (!armed(el, S.outbox.length ? 'Unsynced changes will be lost. Tap again' : 'Tap again to disconnect')) return;
    ['key', 'who', 'data', 'outbox'].forEach(store.del);
    Object.assign(S, { key: '', who: '', data: null, server: null, outbox: [] });
    $('#view').innerHTML = '';
    updateSync();
    openSetup();
  },
  copyKey: async () => {
    try { await navigator.clipboard.writeText(showKey(S.key)); toast('Key copied'); }
    catch (e) { toast('Press and hold the key to copy it', true); }
  },
  syncNow: () => {
    if (!S.outbox.length) { refresh().then(() => toast('Up to date')); return; }
    clearTimeout(retryTimer);
    flush();
  },

  preset: el => { const p = findPreset(el.dataset.n); if (!p) return; $('#fName').value = p.name; setCat(p.category); },
  cat: el => setCat(el.dataset.c),

  saveExp: () => {
    const d = S.draft, err = $('#fErr');
    const who = currentWho('fWho'), m = ($('#fDate').value || iso(today())).slice(0, 7);
    const amount = parseAmt($('#fAmt').value);
    const name = $('#fName').value.trim();
    if (!(amount > 0)) return err.textContent = 'Enter an amount above zero.';
    if (!name) return err.textContent = 'Give the expense a name, or tap a quick pick.';
    if (!d.category) return err.textContent = 'Pick a category.';
    queue('saveExpense', [{
      id: d.id || uid(), created: d.created || Date.now(), amount, name, category: d.category,
      date: $('#fDate').value || iso(today()), who
    }], d.id ? 'Expense updated' : 'Expense saved');
    closeSheet();
    // Personal-limit alert at 70%
    const st = personalStatus(who, m).find(s => s.c.name === d.category);
    if (st && st.pct >= ALERT_AT) setTimeout(() => openBudgetAlert(st, who, m), 260);
  },
  delExp: btn => {
    if (!armed(btn, 'Tap again to delete')) return;
    queue('deleteExpense', [S.draft.id], 'Expense deleted');
    closeSheet();
  },

  saveInc: () => {
    const amount = parseAmt($('#iAmt').value);
    if (!(amount > 0)) return $('#iErr').textContent = 'Enter an amount above zero.';
    queue('saveIncome', [{
      id: uid(), created: Date.now(), amount, date: $('#iDate').value || iso(today()),
      label: $('#iLabel').value.trim() || 'Salary', who: currentWho('iWho')
    }], 'Income saved');
    $('#iAmt').value = '';
    $('#iErr').textContent = '';
  },
  delInc: el => { if (armed(el)) queue('deleteIncome', [el.dataset.id], 'Income deleted'); },

  addGoal: () => {
    const name = $('#gName').value.trim(), target = parseAmt($('#gTarget').value), saved = parseAmt($('#gSaved').value) || 0;
    const deadline = $('#gDeadline').value;
    if (!name) return $('#gErr').textContent = 'Give the goal a name.';
    if (!(target > 0)) return $('#gErr').textContent = 'Enter a goal amount above zero.';
    if (deadline && deadline < iso(today())) return $('#gErr').textContent = 'Pick a date in the future.';
    queue('saveGoal', [{ id: uid(), created: Date.now(), name, target, saved, owner: S.who, deadline }], 'Goal created');
    ['gName', 'gTarget', 'gSaved', 'gDeadline'].forEach(id => { if ($('#' + id)) $('#' + id).value = ''; });
  },
  goalsFor: el => { S.goalsFor = el.dataset.p; render(); },
  editGoal: el => { const g = S.data.goals.find(g => g.id === el.dataset.id); if (g) openGoalEdit(g); },
  saveGoalEdit: () => {
    const g = S.goalDraft;
    const name = $('#geName').value.trim(), target = parseAmt($('#geTarget').value), deadline = $('#geDeadline').value;
    if (!name) return $('#geErr').textContent = 'Give the goal a name.';
    if (!(target > 0)) return $('#geErr').textContent = 'Enter a goal amount above zero.';
    const cur = S.data.goals.find(x => x.id === g.id);
    queue('saveGoal', [{ id: g.id, created: g.created, name, target, saved: cur ? cur.saved : g.saved, owner: g.owner || S.who, deadline }], 'Goal updated');
    closeSheet();
  },
  delGoalSheet: btn => {
    if (!armed(btn, 'Tap again to delete')) return;
    queue('deleteGoal', [S.goalDraft.id], 'Goal deleted');
    closeSheet();
  },
  goalAdj: el => openGoalAdj(el.dataset.id, Number(el.dataset.dir)),
  saveAdj: () => {
    const amount = parseAmt($('#aAmt').value);
    if (!(amount > 0)) return $('#aErr').textContent = 'Enter an amount above zero.';
    queue('adjustGoal', [S.adj.id, amount * S.adj.dir], S.adj.dir > 0 ? 'Money added' : 'Money taken out');
    closeSheet();
  },

  newCat: () => openCategory(),
  editCat: el => { const c = getCat(el.dataset.n); if (c) openCategory(c); },
  cdType: el => { syncCatDraft(); S.catDraft.type = el.dataset.t; renderCatSheet(); },
  cdColor: el => {
    S.catDraft.color = el.dataset.c;
    document.querySelectorAll('#sheet .sw').forEach(b => b.classList.toggle('on', b === el));
  },
  saveCat: () => {
    syncCatDraft();
    const d = S.catDraft, name = d.name.trim();
    if (!name) return $('#cdErr').textContent = 'Type a category name.';
    if (d.isNew && S.data.categories.some(c => eq(c.name, name))) return $('#cdErr').textContent = 'There’s already a category called ' + name + '.';
    const limits = {};
    if (d.type === 'personal') S.data.people.forEach(p => { if (d.limits[p] > 0) limits[p] = d.limits[p]; });
    queue('saveCategory', [{ name, color: d.color, type: d.type, target: d.type === 'personal' ? 0 : d.target, limits }],
      d.isNew ? 'Category added' : 'Category saved');
    closeSheet();
  },
  delCatSheet: btn => {
    if (!armed(btn, 'Tap again to delete')) return;
    queue('deleteCategory', [S.catDraft.name], 'Category deleted');
    closeSheet();
  },
  rename: el => openRename(el.dataset.n),
  saveRename: () => {
    const from = S.renaming, to = $('#rnName').value.trim();
    if (!to) return $('#rnErr').textContent = 'Type a name.';
    if (to === from) return closeSheet();
    if (!eq(to, from) && S.data.people.some(p => eq(p, to))) return $('#rnErr').textContent = 'There’s already someone called ' + to + '.';
    if (eq(S.who, from)) { S.who = to; store.set('who', to); }
    if (S.filter === from) S.filter = to;
    if (S.goalsFor === from) S.goalsFor = to;
    queue('renamePerson', [from, to], 'Renamed to ' + to);
    closeSheet();
  },
  addPreset: () => {
    const name = $('#pName').value.trim(), cat = $('#pCat').value;
    if (!name) return $('#pErr').textContent = 'Type a name for the quick pick.';
    if (!cat) return $('#pErr').textContent = 'Pick a category for the quick pick.';
    $('#pName').value = '';
    $('#pCat').value = '';
    queue('savePreset', [name, cat], 'Quick pick added');
  },
  delPreset: el => { if (armed(el)) queue('deletePreset', [el.dataset.n], 'Quick pick deleted'); },
  addPerson: () => {
    const name = $('#pplName').value.trim();
    if (!name) return toast('Type a name first', true);
    $('#pplName').value = '';
    queue('addPerson', [name], 'Person added');
  },
  delPerson: el => {
    if (S.data.people.length <= 1) return toast('Keep at least one person', true);
    if (armed(el, 'Remove?')) queue('deletePerson', [el.dataset.n], 'Person removed');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTS[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.chg === 'presetCat' && el.value) queue('savePreset', [el.dataset.n, el.value], 'Quick pick updated');
});

// Sync triggers: connection comes back, app returns to the foreground
window.addEventListener('online', () => { clearTimeout(retryTimer); flush(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !S.key || S.locked) return;
  clearTimeout(retryTimer);
  flush();
  refresh();
});

/* ---------- Boot ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

(function boot() {
  render();
  if (!S.key) { openSetup(); return; }
  recompute(); // show the saved copy (plus anything queued) instantly
  flush();
  refresh();
})();
</script>
</body>
</html>
